name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [11, 17, 21]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn clean compile --no-transfer-progress -q

      - name: Run tests
        run: mvn test --no-transfer-progress

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java${{ matrix.java }}
          path: target/surefire-reports/

  install-and-smoke:
    name: Install plugin & smoke test
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven

      - name: Install plugin
        run: mvn clean install -DskipTests --no-transfer-progress -q

      - name: Smoke test — analyze goal on test-consumer
        run: |
          cd test-consumer
          mvn io.github.Miguel-Sanchez241001:dependency-inspector-maven-plugin:1.0-SNAPSHOT:analyze \
            --no-transfer-progress

      - name: Verify report was generated
        run: |
          test -f test-consumer/target/dependency-inspector/report.html \
            && echo "report.html OK" \
            || (echo "report.html NOT FOUND" && exit 1)

      - name: Smoke test — upgrade dry-run on test-consumer
        run: |
          cd test-consumer
          mvn io.github.Miguel-Sanchez241001:dependency-inspector-maven-plugin:1.0-SNAPSHOT:upgrade \
            -DdryRun=true --no-transfer-progress
