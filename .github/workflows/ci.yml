name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [11, 17, 21]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Compile and test
        run: mvn verify --no-transfer-progress

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java${{ matrix.java }}
          path: target/surefire-reports/

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven

      - name: Install plugin locally
        run: mvn clean install -DskipTests --no-transfer-progress -q

      - name: Get plugin version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Smoke test — analyze goal on test-consumer
        run: |
          cd test-consumer
          mvn io.github.miguel-sanchez241001:dependency-inspector-maven-plugin:${{ steps.version.outputs.version }}:analyze \
            --no-transfer-progress

      - name: Verify report was generated
        run: |
          test -f test-consumer/target/dependency-inspector/report.html \
            && echo "report.html OK" \
            || (echo "report.html NOT FOUND" && exit 1)

      - name: Smoke test — upgrade dry-run on test-consumer
        run: |
          cd test-consumer
          mvn io.github.miguel-sanchez241001:dependency-inspector-maven-plugin:${{ steps.version.outputs.version }}:upgrade \
            -DdryRun=true --no-transfer-progress

  trigger-release:
    name: Trigger release
    runs-on: ubuntu-latest
    needs: [test, smoke]
    # Only run on push to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get plugin version
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Dispatch release event to release repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.RELEASE_REPO_PAT }}
          repository: Miguel-Sanchez241001/dep-inspector-release
          event-type: plugin-merged
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "version": "${{ steps.version.outputs.version }}",
              "ref": "${{ github.ref }}"
            }
